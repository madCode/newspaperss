org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
kotlin.code.style=official
android.useAndroidX=true
# F-Droid reproducible builds: otherwise the dex bucket count follows the
# build machine's CPU count and classes.dex differs between builds.
android.dexingNumberOfBuckets=2
