# The part of the security pass a tool can do on its own, so the reading pass has less to cover.
# practices/recurring-reviews.md in claude-playground names both: zizmor for the workflows,
# Scorecard for the repository's own posture.
name: Security scan

on:
  push:
    branches: [main]
  pull_request:
    paths: ['.github/workflows/**', 'gradle/libs.versions.toml', 'app/build.gradle.kts', 'build.gradle.kts']
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflows:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the workflows parse
        # Before zizmor, because zizmor silently SKIPS a workflow it can't parse and still
        # exits clean: dailylog #91 left build-and-test.yml unparseable, zizmor's own log
        # omitted the file without a word, and the required check that workflow defines
        # never reported, so the PR sat blocked with every check it did report green.
        # actionlint reads the same files and fails on one it can't parse. The release
        # binary, not an action, so nothing new runs with this job's token; the checksum
        # pins what's downloaded. shellcheck and pyflakes integration is off until someone
        # has read what they say here -- this step is about the file being valid at all.
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -o pipefail
          tgz="actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tgz" \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/$tgz"
          echo "$SHA256  $RUNNER_TEMP/$tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=

      - name: Audit the workflows
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          # Everything, not only what a PR touched: a workflow is only as safe as the others it
          # can be reached from.
          advanced-security: false
          persona: regular
          config: zizmor.yml

  posture:
    name: scorecard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          # Code-review and branch-protection score low for a solo owner who merges their own
          # PRs. That is expected here and not worth chasing; the useful checks are the others.
          publish_results: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: scorecard.sarif
