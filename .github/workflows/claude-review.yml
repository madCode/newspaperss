# An independent read of every PR, by an agent with no memory of writing the diff. CLAUDE.md's
# author-side review stays; this is the part a convention can't give: a record on the PR itself.
# Passing means a review ran, not that it approved -- which is what makes it safe to require.
name: Claude review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The review compares against main, so it needs main's history.
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request's diff against main. You did not write it and have no
            context beyond what is in the repository, which is the point: read it cold.

            Read CLAUDE.md and docs/DESIGN.md first. This is an Android app that builds a
            finite newspaper from RSS feeds and delivers it to an e-reader as an EPUB. Aim at
            the places this codebase actually breaks:

            - How the change interacts with other features touching the same data, including
              whatever else deletes or replaces that data.
            - Sync and delivery, removal and re-adding, cancellation. Delivery ends in another
              app's hands via an Intent; the app cannot see what happens after that.
            - Rotation, and the app being killed and restored.
            - Feeds, pages and links as untrusted input: a hostile feed, a link that isn't to
              the web, a page in an older encoding, non-Latin digits, an international domain.
            - E-ink, accessibility, and e-reader firmware that lacks standard Android screens.
            - Concurrency: work that reports progress or state from more than one coroutine.
              A test that asserts which of several concurrent callbacks arrives last is asserting
              an ordering the code does not promise.
            - Room entity changes without a bumped version, a Migration, a MigrationTest case
              and the schema JSON committed in app/schemas.

            Report concrete findings only: file:line, and a failure scenario that says what
            input or state produces what wrong result. Most severe first. Make no edits.
            Say plainly when you found nothing worth raising -- a short "no findings" is a
            useful review and padding it with observations is not.

            Do not restate what the diff does, do not praise it, and do not raise style
            preferences the repository does not state. If the PR only touches docs, comments
            or config, say so and stop.

            Use `gh pr comment` for the summary.
            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`)
            for findings anchored to a line.
            Post GitHub comments only -- don't return the review as a message.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git log:*),Bash(git diff:*),Read,Grep,Glob"
