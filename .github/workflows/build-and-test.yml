name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only unless a job asks for more; the build runs third-party plugins and dependencies.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # A build takes about four minutes; a hung test would otherwise hold a PR for GitHub's six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - name: Build, unit tests and coverage
        run: ./gradlew build koverXmlReport koverHtmlReport koverVerify
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: newspaperss-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            core/build/reports/tests/
            build/reports/kover/
          retention-days: 14

  # A fixed link to the newest build from main, for installing on a phone:
  # https://github.com/madCode/newspaperss/releases/download/latest-debug/newspapeRSS-debug.apk
  # Its own job so only these few lines, not the build and its dependencies, get a token that can write.
  publish-debug:
    needs: build
    # Not on a re-run: an older run's number is a lower version code, which phones that
    # already have a newer build can't install.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One at a time, newest wins: two quick merges would otherwise race to update the release.
    concurrency:
      group: latest-debug
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: newspaperss-debug-apk
      - name: Update the latest-debug release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mv app-debug.apk newspapeRSS-debug.apk
          build="${{ github.run_number }}"
          short="${GITHUB_SHA::7}"
          # The same build under a numbered name, so a download can't be mistaken for an older one.
          numbered="newspapeRSS-debug-$build.apk"
          cp newspapeRSS-debug.apk "$numbered"
          title="Debug build $build · $short · $(date -u '+%b %-d')"
          notes="Build $build from main ($short), $(date -u '+%Y-%m-%d %H:%M') UTC. Installs beside a release build as com.app.newspaperss.debug; its version is 0.1.0-debug.$build+$short (Settings, at the bottom)."
          # Updated in place, so the fixed link never 404s between builds. Title, notes and tag
          # follow each build: otherwise the page keeps the first build's date and commit.
          if gh release view latest-debug > /dev/null 2>&1; then
            gh release upload latest-debug newspapeRSS-debug.apk "$numbered" --clobber
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/latest-debug" -f sha="$GITHUB_SHA" -F force=true > /dev/null
            gh release edit latest-debug --title "$title" --notes "$notes"
            # Only the newest numbered copy stays.
            gh release view latest-debug --json assets --jq '.assets[].name' \
              | { grep -E '^newspapeRSS-debug-[0-9]+\.apk$' || true; } | { grep -vx "$numbered" || true; } \
              | while read -r old; do gh release delete-asset latest-debug "$old" -y; done
          else
            gh release create latest-debug newspapeRSS-debug.apk "$numbered" --prerelease --target "$GITHUB_SHA" \
              --title "$title" --notes "$notes"
          fi
