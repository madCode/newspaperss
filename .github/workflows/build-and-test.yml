name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - name: Build, unit tests and coverage
        run: ./gradlew build koverXmlReport koverHtmlReport
      - name: Upload debug APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: newspaperss-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
      # A fixed link to the newest build from main, for installing on a phone:
      # https://github.com/madCode/newspaperss/releases/download/latest-debug/newspapeRSS-debug.apk
      - name: Publish the latest debug build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk newspapeRSS-debug.apk
          gh release delete latest-debug --yes --cleanup-tag || true
          gh release create latest-debug newspapeRSS-debug.apk --prerelease --target "$GITHUB_SHA" \
            --title "Latest debug build" \
            --notes "The newest build from main (${GITHUB_SHA::7}). Installs beside a release build as com.app.newspaperss.debug."
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            core/build/reports/tests/
            build/reports/kover/
          retention-days: 14
