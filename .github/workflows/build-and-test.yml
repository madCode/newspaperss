name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only unless a job asks for more; the build runs third-party plugins and dependencies.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - name: Build, unit tests and coverage
        run: ./gradlew build koverXmlReport koverHtmlReport
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: newspaperss-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            core/build/reports/tests/
            build/reports/kover/
          retention-days: 14

  # A fixed link to the newest build from main, for installing on a phone:
  # https://github.com/madCode/newspaperss/releases/download/latest-debug/newspapeRSS-debug.apk
  # Its own job so only these few lines, not the build and its dependencies, get a token that can write.
  publish-debug:
    needs: build
    # Not on a re-run: an older run's number is a lower version code, which phones that
    # already have a newer build can't install.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One at a time, newest wins: two quick merges would otherwise race to update the release.
    concurrency:
      group: latest-debug
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: newspaperss-debug-apk
      - name: Update the latest-debug release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mv app-debug.apk newspapeRSS-debug.apk
          notes="The newest build from main (${GITHUB_SHA::7}). Installs beside a release build as com.app.newspaperss.debug."
          # Updated in place, so the link never 404s between builds.
          if gh release view latest-debug > /dev/null 2>&1; then
            gh release upload latest-debug newspapeRSS-debug.apk --clobber
            gh release edit latest-debug --notes "$notes"
          else
            gh release create latest-debug newspapeRSS-debug.apk --prerelease --target "$GITHUB_SHA" \
              --title "Latest debug build" --notes "$notes"
          fi
