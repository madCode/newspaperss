name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only unless a job asks for more; the build runs third-party plugins and dependencies.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # A build takes about four minutes; a hung test would otherwise hold a PR for GitHub's six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The build runs plugins and dependencies' code: it gets no token to push with.
          persist-credentials: false
          # Changed-line coverage diffs against the base branch, which needs a merge base.
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - name: Build, unit tests and coverage
        run: ./gradlew build koverXmlReport koverHtmlReport koverVerify
      - name: Coverage of the lines this branch changed
        if: github.event_name == 'pull_request'
        # diff-cover, as rss-to-e-reader uses: one tool rather than one of ours to maintain.
        # --src-roots is needed because kover names packages, not paths, so without it every
        # diff reads as "no lines with coverage information" and the check can never fail.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Without pipefail the exit code below comes from tee, and a coverage failure passes.
          set -o pipefail
          pipx install diff-cover || pip install --quiet diff-cover
          roots="app/src/main/java core/src/main/kotlin"
          # Below 20 changed lines the percentage describes the denominator, not the tests: one
          # uncovered default argument in a four-line diff is 75%. Reported, not enforced.
          # grep exits 1 when it filters everything out, which pipefail would turn into a
          # failed step on any PR that changes no production Kotlin.
          changed=$(git diff --numstat "origin/$BASE_REF...HEAD" -- '*.kt' \
            | { grep -vE '/(test|androidTest|sharedTest)/' || true; } \
            | awk '{ s += $1 } END { print s + 0 }')
          if [ "${changed:-0}" -lt 20 ]; then
            echo "Under 20 changed Kotlin lines outside tests: reporting without enforcing."
            diff-cover build/reports/kover/report.xml --compare-branch="origin/$BASE_REF" --src-roots $roots || true
          else
            diff-cover build/reports/kover/report.xml --compare-branch="origin/$BASE_REF" \
              --src-roots $roots --fail-under=80 | tee /tmp/diffcover.txt
            # Kover names packages, not paths. If --src-roots ever stops matching, diff-cover
            # finds nothing and passes everything: a check that cannot fail. With this many
            # changed lines it should have found some, so say so rather than go quiet.
            if grep -q "No lines with coverage information" /tmp/diffcover.txt; then
              echo "::error::$changed Kotlin lines changed but diff-cover matched none of them. --src-roots is probably wrong for this layout."
              exit 1
            fi
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: newspaperss-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            core/build/reports/tests/
            build/reports/kover/
          retention-days: 14

  # A fixed link to the newest build from main, for installing on a phone:
  # https://github.com/madCode/newspaperss/releases/download/latest-debug/newspapeRSS-debug.apk
  # Its own job so only these few lines, not the build and its dependencies, get a token that can write.
  publish-debug:
    needs: build
    # Not on a re-run: an older run's number is a lower version code, which phones that
    # already have a newer build can't install.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One at a time, newest wins: two quick merges would otherwise race to update the release.
    concurrency:
      group: latest-debug
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: newspaperss-debug-apk
      - name: Update the latest-debug release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mv app-debug.apk newspapeRSS-debug.apk
          build="${{ github.run_number }}"
          short="${GITHUB_SHA::7}"
          # The same build under a numbered name, so a download can't be mistaken for an older one.
          numbered="newspapeRSS-debug-$build.apk"
          cp newspapeRSS-debug.apk "$numbered"
          title="Debug build $build · $short · $(date -u '+%b %-d')"
          notes="Build $build from main ($short), $(date -u '+%Y-%m-%d %H:%M') UTC. Installs beside a release build as com.app.newspaperss.debug; its version is 0.1.0-debug.$build+$short (Settings, at the bottom)."
          # Updated in place, so the fixed link never 404s between builds. Title, notes and tag
          # follow each build: otherwise the page keeps the first build's date and commit.
          if gh release view latest-debug > /dev/null 2>&1; then
            gh release upload latest-debug newspapeRSS-debug.apk "$numbered" --clobber
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/latest-debug" -f sha="$GITHUB_SHA" -F force=true > /dev/null
            gh release edit latest-debug --title "$title" --notes "$notes"
            # Only the newest numbered copy stays.
            gh release view latest-debug --json assets --jq '.assets[].name' \
              | { grep -E '^newspapeRSS-debug-[0-9]+\.apk$' || true; } | { grep -vx "$numbered" || true; } \
              | while read -r old; do gh release delete-asset latest-debug "$old" -y; done
          else
            gh release create latest-debug newspapeRSS-debug.apk "$numbered" --prerelease --target "$GITHUB_SHA" \
              --title "$title" --notes "$notes"
          fi
