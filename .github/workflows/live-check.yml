name: Live check

# Curated lists are read from sites' own pages, which can change without notice. A failed run
# emails the repository owner, ideally before the change reaches anyone's morning paper.
on:
  schedule:
    - cron: '23 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lists:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The build runs plugins and dependencies' code: it gets no token to push with.
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - name: Read each curated list's live page
        env:
          LIVE_CHECK: '1'
        run: ./gradlew :core:test --tests '*LiveListsCheck*' --rerun
