name: Live check

# Curated lists are read from sites' own pages, which can change without notice. A failed run
# emails the repository owner, ideally before the change reaches anyone's morning paper.
on:
  schedule:
    - cron: '23 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lists:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The build runs plugins and dependencies' code: it gets no token to push with.
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - name: Read each curated list's live page
        env:
          LIVE_CHECK: '1'
        run: ./gradlew :core:test --tests '*LiveListsCheck*' --rerun
